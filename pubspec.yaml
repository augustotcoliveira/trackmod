name: trackmod
description: "TrackMod Garage Tracker. Projeto final SI700 (FT Unicamp)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

# Para pegar as versões mais recentes de uma vez, rode no terminal:
# flutter pub add flutter_bloc firebase_core firebase_auth cloud_firestore image_picker google_fonts intl
# flutter pub add flutter_localizations --sdk=flutter
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_bloc: any
  firebase_core: any
  firebase_auth: any
  cloud_firestore: any
  image_picker: any
  google_fonts: any
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any

flutter:
  uses-material-design: true
  assets:
    - assets/images/
